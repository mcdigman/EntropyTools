name: Coverage

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.14"
  NUMBA_DISABLE_JIT: "1"
  MAIN_COVERAGE: "100"

permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          enable-cache: true
          python-version: ${{ env.PYTHON_VERSION }}
          cache-dependency-glob: "**/pyproject.toml"

      - name: Install project with coverage
        run: |
          uv venv
          uv pip install "." coverage

      # The full suite is too slow without JIT compilation, so run only the tests needed for full coverage.
      - name: Run tests under coverage
        run: .venv/bin/python -m coverage run --branch --source=EntropyTools --omit='*/demos/*' -m pytest -m coverage tests

      - name: Coverage report
        env:
          TARGET_REF: ${{ github.base_ref || github.ref_name }}
        run: |
          target="${TARGET_REF}"
          thresh="${MAIN_COVERAGE}"
          echo "Coverage gate for '${target}': ${thresh}%"
          .venv/bin/python -m coverage report -m --fail-under="${thresh}"

      - name: Generate coverage artifacts
        if: ${{ !cancelled() }}
        run: |
          .venv/bin/python -m coverage xml
          .venv/bin/python -m coverage html

      - name: Upload coverage to Coveralls
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329  # v2.3.8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          file: coverage.xml
          format: cobertura
          fail-on-error: ${{ github.ref == 'refs/heads/main' }}
          coverage-reporter-version: v0.6.17

      - name: Upload coverage reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: coverage
          path: |
            coverage.xml
            htmlcov/
          if-no-files-found: error
